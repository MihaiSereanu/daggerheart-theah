name: Deploy Latest Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate content and syntax
        run: npm run validate

      - name: Build packs
        run: |
          node tools/build-packs.mjs --stage
          mv dist/staged-packs packs

      - name: Build system
        run: npm run build

      - name: Prepare rolling manifest
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'system.json';
          const manifest = JSON.parse(await readFile(path, 'utf8'));
          const [major, minor] = manifest.version.split('.');
          const release = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/latest`;

          manifest.version = `${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`;
          manifest.url = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
          manifest.manifest = `${release}/system.json`;
          manifest.download = `${release}/system.zip`;
          manifest.flags ??= {};
          manifest.flags.hotReload = false;

          await writeFile(path, `${JSON.stringify(manifest, null, 4)}\n`);
          NODE

      - name: Create system archive
        run: zip -r ./system.zip system.json README.md LICENSE build/daggerheart.js build/daggerheart.js.map build/tagify.css styles/daggerheart.css styles/heart-dagger.css assets/ templates/ packs/ lang/

      - name: Move rolling tag to this build
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Publish rolling release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: ./system.json,./system.zip
          body: Automatically built from the latest push to `main`.
          commit: ${{ github.sha }}
          name: Latest Build
          replacesArtifacts: true
          tag: latest
          token: ${{ secrets.GITHUB_TOKEN }}
